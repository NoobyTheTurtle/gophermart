basePath: /
definitions:
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_request.Auth:
    properties:
      login:
        example: user
        type: string
      password:
        example: password
        type: string
    required:
    - login
    - password
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_request.Withdrawal:
    properties:
      order:
        example: "2377225624"
        type: string
      sum:
        example: 751
        type: number
    required:
    - order
    - sum
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Auth:
    properties:
      token:
        example: token
        type: string
    required:
    - token
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Balance:
    properties:
      current:
        example: 100
        type: number
      withdrawn:
        example: 10
        type: number
    required:
    - current
    - withdrawn
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error:
    properties:
      error:
        example: message
        type: string
    required:
    - error
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Order:
    properties:
      accrual:
        example: 100
        type: number
      number:
        example: "1234567890"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_entity.OrderStatus'
        example: NEW
      uploaded_at:
        example: "2021-01-01T00:00:00Z"
        type: string
    required:
    - number
    - status
    - uploaded_at
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Ping:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Withdrawal:
    properties:
      order:
        example: "2377225624"
        type: string
      processed_at:
        example: "2020-12-09T16:09:57+03:00"
        type: string
      sum:
        example: 500
        type: number
    required:
    - order
    - processed_at
    - sum
    type: object
  github_com_NoobyTheTurtle_gophermart_internal_entity.OrderStatus:
    enum:
    - NEW
    - PROCESSING
    - INVALID
    - PROCESSED
    type: string
    x-enum-varnames:
    - OrderStatusNew
    - OrderStatusProcessing
    - OrderStatusInvalid
    - OrderStatusProcessed
host: localhost:8081
info:
  contact: {}
  description: API для накопительной системы лояльности «Гофермарт»
  title: Gophermart API
  version: "1.0"
paths:
  /api/user/balance:
    get:
      description: Get current balance and total withdrawn amount
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Balance'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      security:
      - Bearer: []
      summary: Get user balance
      tags:
      - Balance
  /api/user/balance/withdraw:
    post:
      consumes:
      - application/json
      description: Request withdrawal of loyalty points for order payment
      parameters:
      - description: Withdrawal request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_request.Withdrawal'
      produces:
      - application/json
      responses:
        "200":
          description: Withdrawal processed successfully
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      security:
      - Bearer: []
      summary: Process withdrawal
      tags:
      - Withdrawal
  /api/user/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with login and password
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_request.Auth'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Auth'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      summary: Login user
      tags:
      - Auth
  /api/user/orders:
    get:
      description: Get list of user's uploaded orders with statuses and accruals
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Order'
            type: array
        "204":
          description: No orders found
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      security:
      - Bearer: []
      summary: Get user orders
      tags:
      - Orders
    post:
      consumes:
      - text/plain
      description: Upload order number for loyalty points calculation
      parameters:
      - description: Order number
        in: body
        name: order
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order already uploaded by this user
        "202":
          description: New order accepted for processing
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      security:
      - Bearer: []
      summary: Upload order number
      tags:
      - Orders
  /api/user/register:
    post:
      consumes:
      - application/json
      description: Register new user with login and password
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_request.Auth'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Auth'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      summary: Register user
      tags:
      - Auth
  /api/user/withdrawals:
    get:
      description: Get list of user's withdrawals sorted by processing time desc
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Withdrawal'
            type: array
        "204":
          description: No withdrawals found
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Error'
      security:
      - Bearer: []
      summary: Get user withdrawals
      tags:
      - Withdrawal
  /ping:
    get:
      description: Check if the service is alive
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NoobyTheTurtle_gophermart_internal_controller_http_v1_response.Ping'
      summary: Health check
      tags:
      - Health
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
